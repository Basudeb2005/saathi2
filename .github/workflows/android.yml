# Build the phone app.
#
# The APK is not committed — it is built here and attached to the run, so
# there is never a stale binary in the repo claiming to match the source.
#
# To get it: Actions -> Build phone app -> the newest run -> Artifacts ->
# saathi-console-apk. Unzip, move the .apk to your phone, open it, and
# allow installing from that app when Android asks.
name: Build phone app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner has an Android SDK, but not necessarily the platform
      # and build-tools this compileSdk wants.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle --project-dir android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: saathi-console-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
